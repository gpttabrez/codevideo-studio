services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3001
      API_HOST: 0.0.0.0
      RENDER_DATA_DIR: /data
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      CODEVIDEO_PROXY_SECRET: ${CODEVIDEO_PROXY_SECRET}
      CODEVIDEO_WORKER_TOKEN: ${CODEVIDEO_WORKER_TOKEN}
    volumes:
      - render-data:/data
      - render-outputs:/data/outputs
    networks:
      - backend
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
          pids: 256
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    depends_on:
      - api
      - web
    environment:
      NODE_ENV: production
      RENDER_OUTPUTS_DIR: /outputs
      WEB_URL: http://web
      WORKER_API_URL: http://api:3001
      CODEVIDEO_WORKER_TOKEN: ${CODEVIDEO_WORKER_TOKEN}
      RENDER_MAX_EXECUTION_MS: ${RENDER_MAX_EXECUTION_MS:-300000}
    volumes:
      - render-outputs:/outputs
    networks:
      - backend
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
          pids: 512
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_API_URL: ""
    depends_on:
      - api
    environment:
      CODEVIDEO_PROXY_SECRET: ${CODEVIDEO_PROXY_SECRET}
      CODEVIDEO_USERS: ${CODEVIDEO_USERS:-}
      CODEVIDEO_HTPASSWD: ${CODEVIDEO_HTPASSWD:-}
    ports:
      - "8080:8080"
    networks:
      - frontend
      - backend
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /etc/nginx/conf.d:rw,noexec,nosuid,size=1m,uid=101,gid=101,mode=700
      - /etc/nginx/auth:rw,noexec,nosuid,size=1m,uid=101,gid=101,mode=700
      - /var/cache/nginx:rw,noexec,nosuid,size=32m,uid=101,gid=101,mode=700
      - /var/run:rw,nosuid,size=16m,uid=101,gid=101,mode=700
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
          pids: 128
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  render-data:
  render-outputs:

networks:
  frontend:
  backend:
    internal: true
